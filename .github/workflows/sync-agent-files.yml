name: Sync agent files

# Opens (or updates) a PR in every crithits repo that the sync App is installed on
# and that has an AGENTS.local.md. The shared files land in the folder holding
# that marker: the root for a React app, or e.g. apps/web/ in a monorepo.
# There's no repo list: repos made from react-ts-template opt in automatically;
# delete AGENTS.local.md to opt out.

on:
  push:
    branches: [main]
    paths:
      - agents/**
      - .github/sync-files.json
      - .github/workflows/sync-agent-files.yml
      - scripts/discover_sync_targets.py
  schedule:
    # Weekly catch-up for repos created since the last change. (Mondays 09:17 UTC)
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-agent-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # App permissions needed on target repos: Contents (rw), Pull requests (rw), Metadata (r).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.AGENT_SYNC_APP_ID }}
          private-key: ${{ secrets.AGENT_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Lists the App's repos, finds AGENTS.local.md markers, masks every repo
      # name in the logs, and writes the sync config.
      - name: Find repos to sync
        id: targets
        run: python3 scripts/discover_sync_targets.py .github/sync-files.json .github/sync.generated.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: BetaHuhn/repo-file-sync-action@v1
        if: steps.targets.outputs.count != '0'
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_PATH: .github/sync.generated.yml
          GIT_EMAIL: agent-standards-sync[bot]@users.noreply.github.com
          GIT_USERNAME: agent-standards-sync[bot]
          COMMIT_PREFIX: "chore(agents):"
          COMMIT_EACH_FILE: false
          PR_LABELS: agent-standards
          BRANCH_PREFIX: agent-standards/sync
          PR_BODY: |
            Automated sync of shared coding-agent rules from [agent-standards](https://github.com/${{ github.repository }}).

            Updates `AGENTS.md` and `CLAUDE.md`. `AGENTS.local.md` is yours and is never touched.

            To change these rules, open a PR in agent-standards rather than editing here. To stop receiving these PRs, delete the `AGENTS.local.md` next to the synced `AGENTS.md`.
