name: Sync agent files

on:
  push:
    branches: [main]
    paths:
      - agents/**
      - .github/sync.yml
  workflow_dispatch:

concurrency:
  group: sync-agent-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A GitHub App token is preferred over a PAT: scoped per repo, not tied to a person.
      # App permissions needed on target repos: Contents (rw), Pull requests (rw), Metadata (r).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.AGENT_SYNC_APP_ID }}
          private-key: ${{ secrets.AGENT_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_EMAIL: agent-standards-sync[bot]@users.noreply.github.com
          GIT_USERNAME: agent-standards-sync[bot]
          COMMIT_PREFIX: "chore(agents):"
          COMMIT_EACH_FILE: false
          PR_LABELS: agent-standards
          BRANCH_PREFIX: agent-standards/sync
          PR_BODY: |
            Automated sync of shared coding-agent rules from [agent-standards](https://github.com/${{ github.repository }}).

            Updates `AGENTS.md`, `CLAUDE.md`, and the vendored skills. `AGENTS.local.md` is only created if missing and never overwritten.

            To change these rules, open a PR in agent-standards rather than editing here.
