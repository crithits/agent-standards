name: CI and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@crithits"

      - run: pnpm install --frozen-lockfile
      # Synced files land in repos that may run Prettier over Markdown, so keep
      # them clean here rather than failing CI in every opted-in repo.
      - name: Check Markdown formatting
        run: pnpm format:check
      - run: pnpm test
      - name: Test scripts
        run: python3 -m unittest discover -s scripts -v
      # Agents prompt people to update a skill when AGENTS.md lists a newer
      # version than the one installed, so every skill change must raise it.
      - name: Check skill versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 scripts/check_skill_versions.py --base FETCH_HEAD
          else
            python3 scripts/check_skill_versions.py
          fi

      # On main: publish any package whose version isn't in the registry yet.
      # To release, bump "version" in the package's package.json in your PR.
      - name: Publish changed packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm -r publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
