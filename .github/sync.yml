# Which repos get the shared agent files.
# Docs: https://github.com/BetaHuhn/repo-file-sync-action
#
# Add a repo by appending it under `repos:` in the group below. Each push to
# main that changes agents/ opens (or updates) a PR in every listed repo.

group:
  - files:
      # Fully managed — overwritten on every sync.
      - source: agents/AGENTS.md
        dest: AGENTS.md
      - source: agents/CLAUDE.md
        dest: CLAUDE.md
      - source: agents/skills/
        dest: .agents/skills/
        deleteOrphaned: true
      - source: agents/skills/
        dest: .claude/skills/
        deleteOrphaned: true

      # Seeded once — created if missing, never overwritten.
      - source: agents/AGENTS.local.md
        dest: AGENTS.local.md
        replace: false

    # One repo per line (owner/name, optionally @branch). No comments inside this block.
    repos: |
      crithits/react-ts-template
